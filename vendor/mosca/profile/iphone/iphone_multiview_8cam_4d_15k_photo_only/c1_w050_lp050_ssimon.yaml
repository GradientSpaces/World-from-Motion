  - multiview_camera_weights.cam101=0.5
  - multiview_camera_weights.cam102=0.5
  - multiview_camera_weights.cam103=0.5
  - multiview_camera_weights.cam104=0.5
  - multiview_camera_weights.cam105=0.5
  - multiview_camera_weights.cam106=0.5
  - multiview_camera_weights.cam107=0.5
